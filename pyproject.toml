[project]
name = "wealth-agent"
version = "0.1.0"
description = "A deep agent that writes grounded personal-wealth memos — and the eval harness that proves it."
readme = "README.md"
authors = [
    { name = "Adithya Natarajan", email = "adithyanat26@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "deepagents>=0.7,<0.8",
    "fastmcp>=3.4.7",
    "httpx>=0.28.1",
    "langchain>=1.3,<2",
    "langchain-anthropic>=1.5.6",
    "langchain-mcp-adapters>=0.3.2",
    "langchain-openai>=1.5.1",
    "langgraph>=1.2",
    "langsmith[pytest]>=0.11",
    "markdownify>=1.2.3",
    "pandas>=3.0.5",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.3",
    "rich>=15.0.0",
    "tavily-python>=0.7.27",
]

[project.scripts]
wealth = "wealth_agent.cli:main"

[build-system]
requires = ["uv_build>=0.11.2,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "agentevals>=0.0.9",
    "openevals>=0.2.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
